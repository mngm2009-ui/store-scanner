<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة منتجات المحل</title>
    <script type="text/javascript" src="https://unpkg.com/@zxing/library@latest"></script>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
    <style>
        body { font-family: Tahoma, sans-serif; background: #0f172a; color: #334155; padding: 20px 10px; margin: 0; }
        .container { max-width: 500px; margin: auto; background: white; padding: 22px; border-radius: 14px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); }
        h2 { text-align: center; color: #1e293b; margin: 0 0 16px 0; }

        .tabs { display: flex; gap: 8px; margin-bottom: 20px; background: #f1f5f9; padding: 5px; border-radius: 10px; }
        .tab-btn { flex: 1; padding: 10px; border: none; background: transparent; cursor: pointer; font-weight: bold; font-size: 14px; border-radius: 8px; color: #64748b; }
        .tab-btn.active { background: white; color: #0284c7; box-shadow: 0 2px 6px rgba(0,0,0,0.08); }

        .tab-content { display: none; }
        .tab-content.active { display: block; }

        label { display: block; margin-top: 12px; font-weight: bold; color: #475569; font-size: 13px; }
        
        /* فرض الأرقام اللاتينية الإنجليزية والاتجاه الصحيح */
        input, select { 
            width: 100%; padding: 10px; margin-top: 4px; box-sizing: border-box; 
            border: 1px solid #cbd5e1; border-radius: 6px; font-size: 15px; outline: none; 
            font-variant-numeric: tabular-nums;
        }
        input.latin-num { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; direction: ltr; text-align: right; }
        input:focus, select:focus { border-color: #0284c7; }

        .search-box { display: flex; gap: 6px; margin-top: 5px; }
        .search-box input { margin-top: 0; }
        .btn-search { background: #0284c7; color: white; border: none; padding: 0 16px; border-radius: 6px; font-weight: bold; cursor: pointer; white-space: nowrap; }

        .weight-box { display: flex; gap: 8px; }
        .weight-box input { flex: 2; }
        .weight-box select { flex: 1; }

        .scan-btn { background: #334155; margin-top: 8px; color: white; border: none; padding: 11px; border-radius: 8px; width: 100%; cursor: pointer; font-size: 14px; font-weight: bold; }
        .no-barcode-btn { background: #f1f5f9; margin-top: 8px; color: #475569; border: 1px solid #e2e8f0; padding: 8px; border-radius: 6px; width: 100%; cursor: pointer; font-weight: bold; font-size: 12px; }

        .status-badge { display: none; margin-top: 10px; padding: 8px; border-radius: 6px; font-size: 13px; font-weight: bold; text-align: center; }
        .status-badge.found { display: block; background: #ecfdf5; color: #047857; border: 1px solid #a7f3d0; }
        .status-badge.new { display: block; background: #eff6ff; color: #1d4ed8; border: 1px solid #bfdbfe; }

        .action-buttons { display: flex; gap: 8px; margin-top: 18px; }
        .btn-action { flex: 1; border: none; padding: 12px; border-radius: 8px; font-size: 14px; cursor: pointer; font-weight: bold; }
        .btn-update { background: #0284c7; color: white; }
        .btn-cancel { background: #64748b; color: white; }
        .btn-add { background: #16a34a; color: white; width: 100%; }
        button:disabled { background: #94a3b8 !important; cursor: not-allowed; }

        #cropContainer { display: none; margin-top: 12px; text-align: center; background: #0f172a; padding: 10px; border-radius: 8px; }
        #previewCanvas { max-width: 100%; border: 2px dashed #38bdf8; cursor: crosshair; display: block; margin: 0 auto; touch-action: none; }
        .confirm-crop-btn { background: #16a34a; color: white; border: none; padding: 9px; width: 100%; margin-top: 8px; border-radius: 6px; font-weight: bold; cursor: pointer; }

        .drop-zone { border: 2px dashed #0284c7; background: #f0f9ff; border-radius: 10px; padding: 25px 15px; text-align: center; cursor: pointer; }
        .drop-zone p { margin: 0; font-weight: bold; color: #0369a1; font-size: 14px; }
        .preview-box { margin-top: 15px; display: none; }
        .table-wrap { max-height: 220px; overflow-y: auto; border: 1px solid #e2e8f0; border-radius: 6px; margin-top: 8px; }
        table { width: 100%; border-collapse: collapse; font-size: 12px; text-align: right; }
        th, td { padding: 8px; border-bottom: 1px solid #f1f5f9; }
        th { background: #f8fafc; color: #475569; position: sticky; top: 0; }

        #message { text-align: center; margin-top: 14px; font-weight: bold; font-size: 14px; min-height: 22px; }
    </style>
</head>
<body>

<div class="container">
    <h2>إدارة وتعديل المنتجات</h2>

    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('single')">🏷️ فحص وتعديل منتج</button>
        <button class="tab-btn" onclick="switchTab('bulk')">📁 رفع ملف إكسل</button>
    </div>

    <!-- تبويب منتج فردي -->
    <div id="singleTab" class="tab-content active">
        <label for="barcode">كود المنتج أو الاسم للبحث:</label>
        <div class="search-box">
            <input type="text" id="barcode" class="latin-num" placeholder="امسح أو اكتب الكود..." oninput="forceLatinDigits(this)" onkeydown="if(event.key==='Enter') searchProduct();">
            <button type="button" id="searchBtn" class="btn-search" onclick="searchProduct()">🔍 بحث</button>
        </div>

        <button type="button" class="scan-btn" onclick="document.getElementById('nativeCamera').click();">📸 مسح عبر الكاميرا</button>
        <input type="file" id="nativeCamera" accept="image/*" capture="environment" style="display:none;" onchange="loadCropper(this)">

        <div id="cropContainer">
            <div style="color:#f8fafc; font-size:12px; margin-bottom:6px;">حدد الباركود داخل المربع:</div>
            <canvas id="previewCanvas"></canvas>
            <button type="button" class="confirm-crop-btn" onclick="readCroppedBarcode()">✔ قراءة وبحث فوري</button>
        </div>

        <button type="button" class="no-barcode-btn" onclick="setNoBarcode()">🏷️ توليد كود آلي جديد</button>

        <div id="statusBadge" class="status-badge"></div>

        <label for="name">اسم المنتج:</label>
        <input type="text" id="name" placeholder="مثال: مياه معدنية">

        <label for="category">القسم:</label>
        <select id="category">
            <option value="مشروبات">مشروبات (Getränke)</option>
            <option value="معلبات وأغذية">معلبات وأغذية (Food)</option>
            <option value="حلويات ومقرمشات">حلويات ومقرمشات (Süßwaren)</option>
            <option value="خضار وفواكه">خضار وفواكه (Obst & Gemüse)</option>
            <option value="منظفات ومستلزمات">منظفات ومستلزمات (Haushalt)</option>
            <option value="أخرى">أخرى (Sonstiges)</option>
        </select>

        <label for="price">السعر الأساسي للمنتج (€):</label>
        <input type="text" id="price" class="latin-num" placeholder="مثال: 4.00" oninput="forceLatinDigits(this)">

        <label for="offer">سعر العرض (€) - اختياري:</label>
        <input type="text" id="offer" class="latin-num" placeholder="مثال: 3.49" oninput="forceLatinDigits(this)">

        <label>الوزن أو الحجم:</label>
        <div class="weight-box">
            <input type="text" id="weightValue" class="latin-num" placeholder="مثال: 500" oninput="forceLatinDigits(this)">
            <select id="weightUnit">
                <option value="g">g (غرام)</option>
                <option value="kg">kg (كغ)</option>
                <option value="ml">ml (مل)</option>
                <option value="l">l (لتر)</option>
                <option value="Stück">Stück (قطعة)</option>
            </select>
        </div>

        <label for="quantity">الكمية في المخزون:</label>
        <input type="text" id="quantity" class="latin-num" placeholder="مثال: 20" oninput="forceLatinDigits(this)">

        <div id="actionContainer" class="action-buttons">
            <button class="btn-action btn-add" id="btnSubmit" onclick="submitProduct('insert')">💾 حفظ كمنتج جديد</button>
        </div>
    </div>

    <!-- تبويب رفع الإكسل -->
    <div id="bulkTab" class="tab-content">
        <div class="drop-zone" onclick="document.getElementById('fileInput').click()">
            <p>📂 اضغط لاختيار ملف إكسل أو اسحبه هنا</p>
            <span style="font-size:12px; color:#64748b;">يدعم (.xlsx, .xls, .csv)</span>
        </div>
        <input type="file" id="fileInput" accept=".xlsx, .xls, .csv" style="display:none;" onchange="handleExcelFile(this.files[0])">

        <div class="preview-box" id="previewBox">
            <div style="font-weight:bold; font-size:13px; margin-top:10px;">عدد المنتجات: <span id="rowCount" class="latin-num">0</span></div>
            <div class="table-wrap">
                <table id="previewTable">
                    <thead>
                        <tr><th>الباركود</th><th>الاسم</th><th>السعر</th><th>العرض</th><th>الكمية</th></tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
            <button class="btn-action btn-update" style="width:100%; margin-top:15px;" id="bulkSaveBtn" onclick="uploadBulkProducts()">🚀 رفع وتحديث الكل بالشيت</button>
        </div>
    </div>

    <p id="message"></p>
</div>

<script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbz6VkxJteGJAeQaR5oTqdYValeCbxP62sr71HzkbcYy9kviVPb3cdK4-fdCgb0uibIHIA/exec";

    function toLatin(str) {
        if (!str) return "";
        return String(str)
            .replace(/[٠-٩]/g, d => d.charCodeAt(0) - 1632)
            .replace(/[۰-۹]/g, d => d.charCodeAt(0) - 1776);
    }

    function forceLatinDigits(input) {
        const currentPos = input.selectionStart;
        input.value = toLatin(input.value);
        input.setSelectionRange(currentPos, currentPos);
    }

    function switchTab(tab) {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
        document.getElementById('message').innerText = '';

        if (tab === 'single') {
            document.querySelectorAll('.tab-btn')[0].classList.add('active');
            document.getElementById('singleTab').classList.add('active');
        } else {
            document.querySelectorAll('.tab-btn')[1].classList.add('active');
            document.getElementById('bulkTab').classList.add('active');
        }
    }

    // البحث يعمل الآن عبر POST لتخطي قيود CORS وإعادة التوجيه تماماً
    async function searchProduct() {
        const query = toLatin(document.getElementById('barcode').value.trim());
        const msg = document.getElementById('message');
        const badge = document.getElementById('statusBadge');
        const actionBox = document.getElementById('actionContainer');
        const searchBtn = document.getElementById('searchBtn');

        if (!query) {
            msg.style.color = '#ef4444';
            msg.innerText = '⚠️ يرجى إدخال كود المنتج أو اسمه للبحث';
            return;
        }

        searchBtn.disabled = true;
        msg.style.color = '#0284c7';
        msg.innerText = '🔍 جاري البحث في الشيت...';

        try {
            const res = await fetch(SCRIPT_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify({ action: 'search', query: query })
            });

            const data = await res.json();

            if (data.status === 'success' && data.found) {
                const p = data.product;
                document.getElementById('barcode').value = toLatin(p.barcode);
                document.getElementById('name').value = p.name;
                document.getElementById('category').value = p.category || 'أخرى';
                document.getElementById('price').value = toLatin(p.price);
                document.getElementById('offer').value = toLatin(p.offer);
                document.getElementById('quantity').value = toLatin(p.quantity);

                if (p.size) {
                    const parts = p.size.split(' ');
                    document.getElementById('weightValue').value = toLatin(parts[0] || '');
                    if (parts[1]) document.getElementById('weightUnit').value = parts[1];
                } else {
                    document.getElementById('weightValue').value = '';
                }

                badge.className = 'status-badge found';
                badge.innerText = '✅ تم العثور على المنتج في الشيت. يمكنك تعديله الآن:';
                
                actionBox.innerHTML = `
                    <button class="btn-action btn-update" onclick="submitProduct('update')">🔄 تحديث المنتج في الشيت</button>
                    <button class="btn-action btn-cancel" onclick="resetForm()">❌ إلغاء وتفريغ</button>
                `;
                msg.innerText = '';
            } else {
                badge.className = 'status-badge new';
                badge.innerText = 'ℹ️ منتج جديد غير مسجل في الشيت.';
                actionBox.innerHTML = `
                    <button class="btn-action btn-add" onclick="submitProduct('insert')">💾 حفظ كمنتج جديد</button>
                `;
                msg.innerText = '';
            }
        } catch (e) {
            console.error(e);
            msg.style.color = '#ef4444';
            msg.innerText = '❌ تعذر إتمام البحث. تحقق من إعدادات النشر كـ (New version).';
        } finally {
            searchBtn.disabled = false;
        }
    }

    function resetForm() {
        document.getElementById('barcode').value = '';
        document.getElementById('name').value = '';
        document.getElementById('price').value = '';
        document.getElementById('offer').value = '';
        document.getElementById('weightValue').value = '';
        document.getElementById('quantity').value = '';
        document.getElementById('statusBadge').style.display = 'none';
        document.getElementById('actionContainer').innerHTML = `
            <button class="btn-action btn-add" onclick="submitProduct('insert')">💾 حفظ كمنتج جديد</button>
        `;
        document.getElementById('message').innerText = '';
    }

    async function submitProduct(mode) {
        let barcode = toLatin(document.getElementById('barcode').value.trim());
        const name = document.getElementById('name').value.trim();
        const category = document.getElementById('category').value;
        const price = toLatin(document.getElementById('price').value.trim());
        const offer = toLatin(document.getElementById('offer').value.trim());
        const val = toLatin(document.getElementById('weightValue').value.trim());
        const weight = val ? (val + " " + document.getElementById('weightUnit').value) : '';
        const quantity = toLatin(document.getElementById('quantity').value.trim());
        const msg = document.getElementById('message');

        if (!name || !price) {
            msg.style.color = '#ef4444';
            msg.innerText = '⚠️ الاسم والسعر مطلوبان للمتابعة!';
            return;
        }

        if (!barcode) {
            barcode = "LOCAL-" + Math.floor(1000 + Math.random() * 9000);
            document.getElementById('barcode').value = barcode;
        }

        msg.style.color = '#0284c7';
        msg.innerText = mode === 'update' ? '⏳ جاري تحديث بيانات المنتج...' : '⏳ جاري حفظ المنتج الجديد...';

        try {
            const res = await fetch(SCRIPT_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify({
                    mode: mode,
                    barcode: barcode,
                    name: name,
                    category: category,
                    price: price,
                    offer: offer,
                    size: weight,
                    quantity: quantity || "0"
                })
            });

            const data = await res.json();
            if (data.status === 'success') {
                msg.style.color = '#16a34a';
                msg.innerText = '✅ ' + data.message;
                setTimeout(resetForm, 1500);
            } else {
                msg.style.color = '#ef4444';
                msg.innerText = '❌ ' + data.message;
            }
        } catch (e) {
            msg.style.color = '#ef4444';
            msg.innerText = '❌ فشل الاتصال بالخادم.';
        }
    }

    let loadedImage = new Image(), canvas, ctx;
    let startX, startY, endX, endY, isDrawing = false, imgScale = 1;

    function loadCropper(input) {
        if (input.files && input.files[0]) {
            const reader = new FileReader();
            reader.onload = function (e) {
                loadedImage.onload = function () {
                    document.getElementById('cropContainer').style.display = 'block';
                    canvas = document.getElementById('previewCanvas');
                    ctx = canvas.getContext('2d');
                    imgScale = loadedImage.width > 320 ? 320 / loadedImage.width : 1;
                    canvas.width = loadedImage.width * imgScale;
                    canvas.height = loadedImage.height * imgScale;
                    startX = canvas.width * 0.15; startY = canvas.height * 0.35;
                    endX = canvas.width * 0.85; endY = canvas.height * 0.65;
                    drawBox();
                    setupTouch();
                };
                loadedImage.src = e.target.result;
            };
            reader.readAsDataURL(input.files[0]);
        }
        input.value = '';
    }

    function drawBox() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(loadedImage, 0, 0, canvas.width, canvas.height);
        ctx.fillStyle = 'rgba(0,0,0,0.5)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        let x = Math.min(startX, endX), y = Math.min(startY, endY), w = Math.abs(endX - startX), h = Math.abs(endY - startY);
        ctx.clearRect(x, y, w, h);
        ctx.drawImage(loadedImage, x/imgScale, y/imgScale, w/imgScale, h/imgScale, x, y, w, h);
        ctx.strokeStyle = '#38bdf8'; ctx.lineWidth = 2; ctx.strokeRect(x, y, w, h);
    }

    function setupTouch() {
        const getPos = (e) => {
            let r = canvas.getBoundingClientRect(), cx = e.touches ? e.touches[0].clientX : e.clientX, cy = e.touches ? e.touches[0].clientY : e.clientY;
            return { x: cx - r.left, y: cy - r.top };
        };
        canvas.onmousedown = (e) => { isDrawing = true; let p = getPos(e); startX = p.x; startY = p.y; };
        canvas.onmousemove = (e) => { if (!isDrawing) return; let p = getPos(e); endX = p.x; endY = p.y; drawBox(); };
        canvas.onmouseup = () => { isDrawing = false; };
        canvas.ontouchstart = (e) => { isDrawing = true; let p = getPos(e); startX = p.x; startY = p.y; e.preventDefault(); };
        canvas.ontouchmove = (e) => { if (!isDrawing) return; let p = getPos(e); endX = p.x; endY = p.y; drawBox(); e.preventDefault(); };
        canvas.ontouchend = () => { isDrawing = false; };
    }

    function readCroppedBarcode() {
        const msg = document.getElementById('message');
        msg.style.color = '#0284c7'; msg.innerText = '⚙️ جاري قراءة الباركود والبحث...';
        let x = Math.min(startX, endX) / imgScale, y = Math.min(startY, endY) / imgScale, w = Math.abs(endX - startX) / imgScale, h = Math.abs(endY - startY) / imgScale;
        let c = document.createElement('canvas'); c.width = w; c.height = h;
        c.getContext('2d').drawImage(loadedImage, x, y, w, h, 0, 0, w, h);

        new ZXing.BrowserBarcodeReader().decodeFromImage(c)
            .then(res => {
                document.getElementById('barcode').value = toLatin(res.text);
                document.getElementById('cropContainer').style.display = 'none';
                searchProduct();
            })
            .catch(() => {
                msg.style.color = '#ef4444'; msg.innerText = '❌ لم يتم العثور على باركود، أعد التحديد بدقة';
            });
    }

    function setNoBarcode() {
        document.getElementById('cropContainer').style.display = 'none';
        document.getElementById('barcode').value = "LOCAL-" + Math.floor(1000 + Math.random() * 9000);
        searchProduct();
    }

    let bulkItems = [];
    function handleExcelFile(file) {
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(e) {
            const workbook = XLSX.read(new Uint8Array(e.target.result), { type: 'array' });
            const sheet = workbook.Sheets[workbook.SheetNames[0]];
            const json = XLSX.utils.sheet_to_json(sheet, { defval: "" });

            bulkItems = json.map(row => {
                const find = (keys) => {
                    for (let k in row) {
                        if (keys.some(key => k.trim().toLowerCase().includes(key))) return row[k];
                    }
                    return "";
                };
                return {
                    barcode: toLatin(String(find(['بار كود', 'باركود', 'barcode', 'code', 'كود'])).trim()),
                    name: String(find(['اسم', 'name', 'artikel', 'منتج'])).trim(),
                    category: String(find(['قسم', 'تصنيف', 'category']) || 'عام').trim(),
                    price: toLatin(String(find(['سعر', 'price', 'preis']))),
                    offer: toLatin(String(find(['عرض', 'تخفيض', 'offer']))),
                    size: toLatin(String(find(['وزن', 'حجم', 'size', 'weight']))),
                    quantity: toLatin(String(find(['كمية', 'مخزون', 'quantity', 'qty']) || "0"))
                };
            }).filter(i => i.barcode || i.name);

            renderBulkPreview();
        };
        reader.readAsArrayBuffer(file);
    }

    function renderBulkPreview() {
        const tbody = document.querySelector('#previewTable tbody');
        tbody.innerHTML = '';
        document.getElementById('rowCount').innerText = bulkItems.length;

        bulkItems.slice(0, 30).forEach(i => {
            const tr = document.createElement('tr');
            tr.innerHTML = `<td class="latin-num">${i.barcode || 'آلي'}</td><td>${i.name}</td><td class="latin-num">${i.price || '-'}</td><td class="latin-num">${i.offer || '-'}</td><td class="latin-num">${i.quantity}</td>`;
            tbody.appendChild(tr);
        });

        document.getElementById('previewBox').style.display = 'block';
    }

    async function uploadBulkProducts() {
        if (!bulkItems.length) return;
        const btn = document.getElementById('bulkSaveBtn');
        const msg = document.getElementById('message');

        btn.disabled = true;
        msg.style.color = '#0284c7'; 
        msg.innerText = `⏳ جاري رفع وتحديث ${bulkItems.length} منتج بالأرقام اللاتينية...`;

        try {
            const res = await fetch(SCRIPT_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify({ action: 'bulk_import', products: bulkItems })
            });
            const data = await res.json();
            if (data.status === 'success') {
                msg.style.color = '#16a34a'; 
                msg.innerText = '✅ ' + data.message;
                bulkItems = [];
                setTimeout(() => {
                    document.getElementById('previewBox').style.display = 'none';
                    document.getElementById('fileInput').value = '';
                }, 3000);
            } else {
                msg.style.color = '#ef4444'; 
                msg.innerText = '❌ ' + data.message;
            }
        } catch (e) {
            msg.style.color = '#ef4444'; 
            msg.innerText = '❌ فشل الاتصال بالخادم';
        } finally {
            btn.disabled = false;
        }
    }
</script>

</body>
</html>
