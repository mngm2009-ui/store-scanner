<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>نظام الكاشير - جهاز السكنر</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    body {
      background-color: #0f172a;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 16px;
    }
    header {
      text-align: center;
      margin-bottom: 12px;
    }
    h1 {
      font-size: 1.4rem;
      font-weight: 700;
      margin-bottom: 4px;
    }
    #status {
      font-size: 0.85rem;
      color: #38bdf8;
    }
    .input-section {
      margin-bottom: 12px;
    }
    #barcode-input {
      width: 100%;
      padding: 14px;
      font-size: 1.15rem;
      font-weight: bold;
      border-radius: 12px;
      border: 2px solid #3b82f6;
      background-color: #1e293b;
      color: #38bdf8;
      text-align: center;
      outline: none;
      transition: border-color 0.2s;
    }
    #barcode-input:focus {
      border-color: #60a5fa;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.25);
    }
    #feedback {
      min-height: 48px;
      padding: 10px 14px;
      border-radius: 10px;
      margin-bottom: 12px;
      font-weight: 600;
      font-size: 0.95rem;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      background-color: #1e293b;
      border: 1px dashed #334155;
    }
    .success {
      background-color: #14532d !important;
      color: #86efac !important;
      border: 1px solid #22c55e !important;
    }
    .error {
      background-color: #7f1d1d !important;
      color: #fca5a5 !important;
      border: 1px solid #ef4444 !important;
    }
    .total-card {
      background-color: #1e293b;
      border: 1px solid #334155;
      border-radius: 14px;
      padding: 14px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }
    .total-title {
      font-size: 0.9rem;
      color: #94a3b8;
    }
    .total-price {
      font-size: 1.7rem;
      font-weight: 800;
      color: #22c55e;
    }
    .btn-clear {
      background-color: #dc2626;
      color: #fff;
      border: none;
      padding: 8px 14px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
    }
    .cart-container {
      flex: 1;
      background-color: #ffffff;
      border-radius: 14px;
      padding: 12px;
      color: #0f172a;
      overflow-y: auto;
      max-height: 48vh;
    }
    .cart-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 6px;
      border-bottom: 1px solid #e2e8f0;
    }
    .item-name {
      font-weight: 600;
      font-size: 0.95rem;
    }
    .item-price {
      font-weight: 700;
      color: #16a34a;
    }
    .empty-cart {
      text-align: center;
      color: #94a3b8;
      padding-top: 40px;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>

  <header>
    <h1>🧾 كاشير المحل (وضع السكنر)</h1>
    <div id="status">⏳ جاري تحميل المنتجات...</div>
  </header>

  <!-- خانة إدخال السكنر -->
  <div class="input-section">
    <input 
      type="text" 
      id="barcode-input" 
      placeholder="امسح بالسكنر مباشرة..." 
      autocomplete="off" 
      autocorrect="off" 
      autocapitalize="off" 
      spellcheck="false"
      autofocus
    >
  </div>

  <!-- تنبيه المسحة الأخيرة -->
  <div id="feedback">في انتظار المسح بالسكنر...</div>

  <!-- ملخص الحساب والإجمالي -->
  <div class="total-card">
    <div>
      <div class="total-title">المجموع الكلي</div>
      <div class="total-price" id="total-val">0.00 €</div>
    </div>
    <button class="btn-clear" onclick="clearCart()">سلة جديدة</button>
  </div>

  <!-- قائمة المنتجات -->
  <div class="cart-container" id="cart-list">
    <div class="empty-cart">السلة فارغة - ابدأ بمسح الباركود</div>
  </div>

  <script>
    const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQCpR9i8vwj3iwcjDyB3xQjx2iTaD3s1kLjYRbwNQW-IOcrdADwRE4mBGbk96pxKGKLYqfbpjVuDLqI/pub?output=csv";

    let products = [];
    let cart = [];
    const inputField = document.getElementById('barcode-input');
    const statusDiv = document.getElementById('status');
    const feedbackDiv = document.getElementById('feedback');
    const cartList = document.getElementById('cart-list');
    const totalVal = document.getElementById('total-val');

    // جلب بيانات المنتجات من الجدول
    fetch(SHEET_CSV_URL)
      .then(res => res.text())
      .then(csvText => {
        const rows = csvText.split('\n').map(r => r.split(','));
        const headers = rows[0].map(h => h.trim().toLowerCase());
        const loaded = [];

        for (let i = 1; i < rows.length; i++) {
          const row = rows[i];
          if (row.length < 2) continue;
          let item = {};
          headers.forEach((h, idx) => { item[h] = row[idx] ? row[idx].trim() : ''; });
          
          const barcode = item['barcode'] || item['بار كود'] || row[0] || '';
          const name = item['produkt'] || item['name'] || item['الاسم'] || row[1] || '';
          const price = parseFloat(item['preis'] || item['price'] || item['السعر'] || row[2] || 0);

          if (barcode) {
            loaded.push({ barcode: String(barcode).trim(), name, price });
          }
        }
        products = loaded;
        statusDiv.textContent = `✅ جاهز للمسح (${loaded.length} منتج)`;
        keepFocus();
      })
      .catch(() => {
        statusDiv.textContent = "❌ خطأ في تحميل جدول المنتجات";
      });

    // إبقاء المؤشر ثابتاً دائماً داخل خانة الباركود
    function keepFocus() {
      setTimeout(() => {
        inputField.focus();
      }, 50);
    }

    // إذا ضغط المستخدم في أي مكان بالصفحة، يعود التركيز فوراً للخانة
    document.addEventListener('click', (e) => {
      if (e.target.tagName !== 'BUTTON') {
        keepFocus();
      }
    });

    // استقبال مدخلات السكنر عند الضغط على Enter تلقائياً
    inputField.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        processScan(inputField.value.trim());
      }
    });

    function processScan(code) {
      if (!code) return;

      const product = products.find(p => String(p.barcode).trim() === code);

      if (product) {
        cart.unshift(product);
        showFeedback(`✅ ${product.name} - ${product.price.toFixed(2)} €`, "success");
        renderCart();
      } else {
        showFeedback(`❌ كود غير مسجل: ${code}`, "error");
      }

      // تصفير الخانة وإعادة التركيز فوراً للمسحة القادمة
      inputField.value = "";
      keepFocus();
    }

    function showFeedback(text, type) {
      feedbackDiv.textContent = text;
      feedbackDiv.className = type;
    }

    function renderCart() {
      if (cart.length === 0) {
        cartList.innerHTML = '<div class="empty-cart">السلة فارغة - ابدأ بمسح الباركود</div>';
        totalVal.textContent = "0.00 €";
        return;
      }

      let html = "";
      let sum = 0;

      cart.forEach(item => {
        sum += item.price;
        html += `
          <div class="cart-item">
            <span class="item-name">${item.name}</span>
            <span class="item-price">${item.price.toFixed(2)} €</span>
          </div>
        `;
      });

      cartList.innerHTML = html;
      totalVal.textContent = `${sum.toFixed(2)} €`;
    }

    function clearCart() {
      cart = [];
      renderCart();
      feedbackDiv.textContent = "تم مسح السلة والبدء من جديد";
      feedbackDiv.className = "";
      keepFocus();
    }
  </script>
</body>
</html>
