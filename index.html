<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ماسح أسعار المنتجات</title>
    <!-- مكتبة الكاميرا -->
    <script src="https://unpkg.com/html5-qrcode"></script>
    <!-- مكتبة قراءة جداول جوجل -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            text-align: center;
            background-color: #eef2f5;
            padding: 15px;
            margin: 0;
        }
        .container {
            max-width: 480px;
            margin: 0 auto;
        }
        h2 {
            color: #1e293b;
            font-size: 26px;
            margin: 10px 0 15px 0;
        }
        #status {
            font-weight: 600;
            margin-bottom: 15px;
            font-size: 16px;
            color: #d97706;
        }
        #camera-wrapper {
            background: #000;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 8px 24px rgba(0,0,0,0.12);
            margin-bottom: 20px;
        }
        #reader {
            width: 100%;
        }
        #result-card {
            background: #ffffff;
            border-radius: 20px;
            padding: 30px 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            display: none;
            animation: popIn 0.3s ease-out;
        }
        @keyframes popIn {
            from { transform: scale(0.95); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
        .product-title {
            font-size: 28px;
            font-weight: 800;
            color: #0f172a;
            margin-bottom: 10px;
            line-height: 1.3;
        }
        .product-desc {
            font-size: 18px;
            color: #64748b;
            margin-bottom: 20px;
        }
        .price-box {
            background: #f8fafc;
            border-radius: 16px;
            padding: 20px;
            margin: 20px 0;
            border: 2px solid #e2e8f0;
        }
        .price-normal {
            font-size: 44px;
            font-weight: 900;
            color: #16a34a;
        }
        .old-price {
            text-decoration: line-through;
            color: #94a3b8;
            font-size: 22px;
            margin-bottom: 6px;
            font-weight: 600;
        }
        .price-offer {
            font-size: 48px;
            font-weight: 900;
            color: #dc2626;
        }
        .offer-tag {
            display: inline-block;
            background-color: #fee2e2;
            color: #dc2626;
            padding: 6px 16px;
            border-radius: 50px;
            font-weight: bold;
            font-size: 16px;
            margin-top: 8px;
        }
        .error-box {
            color: #dc2626;
            font-size: 24px;
            font-weight: bold;
            padding: 20px;
        }
        /* زر مسح منتج جديد بحجم كبير ومريح */
        .btn-scan-again {
            width: 100%;
            background: #2563eb;
            color: #ffffff;
            border: none;
            padding: 18px;
            font-size: 22px;
            font-weight: bold;
            border-radius: 14px;
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(37, 99, 235, 0.4);
            margin-top: 15px;
            transition: background 0.2s;
        }
        .btn-scan-again:active {
            background: #1d4ed8;
            transform: scale(0.98);
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>📱 ماسح أسعار المنتجات</h2>
        <div id="status">⏳ جاري الاتصال بالجدول...</div>

        <!-- حاوية الكاميرا -->
        <div id="camera-wrapper">
            <div id="reader"></div>
        </div>

        <!-- كرت عرض تفاصيل المنتج بعد المسح -->
        <div id="result-card">
            <div id="product-content"></div>
            <button class="btn-scan-again" onclick="restartCamera()">📷 مسح منتج آخر</button>
        </div>
    </div>

    <script>
        let products = [];
        let html5QrCode = null;
        let isCameraRunning = false;

        const sheetUrl = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQCpR9i8vwj3iwcjDyB3xQjx2iTaD3s1kLjYRbwNQW-IOcrdADwRE4mBGbk96pxKGKLYqfbpjVuDLqI/pub?output=csv";

        // تحميل بيانات المنتجات من جداول جوجل
        Papa.parse(sheetUrl, {
            download: true,
            header: true,
            skipEmptyLines: true,
            complete: function(results) {
                products = results.data;
                const statusDiv = document.getElementById('status');
                if (products.length > 0) {
                    statusDiv.innerText = `✅ جاهز للعمل (${products.length} منتج مسجل)`;
                    statusDiv.style.color = "#16a34a";
                    startDirectCamera();
                } else {
                    statusDiv.innerText = "⚠️ لم يتم العثور على بيانات في الجدول.";
                    statusDiv.style.color = "#dc2626";
                }
            },
            error: function() {
                const statusDiv = document.getElementById('status');
                statusDiv.innerText = "❌ تعذر قراءة البيانات من جوجل شيت.";
                statusDiv.style.color = "#dc2626";
            }
        });

        function cleanString(val) {
            return val ? String(val).trim() : "";
        }

        // مطابقة الباركود بمرونة
        function findProduct(code) {
            const rawScan = cleanString(code);
            const noZerosScan = rawScan.replace(/^0+/, '');

            return products.find(p => {
                const pBarcode = cleanString(p.barcode || p.Barcode || p['بار كود'] || p['كود']);
                const pNoZeros = pBarcode.replace(/^0+/, '');
                return (pBarcode === rawScan) || (noZerosScan !== "" && noZerosScan === pNoZeros);
            });
        }

        // تشغيل الكاميرا الخلفية مباشرة
        function startDirectCamera() {
            document.getElementById('camera-wrapper').style.display = 'block';
            document.getElementById('result-card').style.display = 'none';
            document.getElementById('status').innerText = "📷 وجّه الكاميرا نحو الباركود";

            if (!html5QrCode) {
                html5QrCode = new Html5Qrcode("reader");
            }

            const config = { 
                fps: 15, 
                qrbox: { width: 280, height: 180 },
                aspectRatio: 1.0
            };

            html5QrCode.start({ facingMode: "environment" }, config, onScanSuccess)
                .then(() => {
                    isCameraRunning = true;
                })
                .catch(err => {
                    console.error(err);
                    document.getElementById('status').innerText = "⚠️ يرجى السماح بتشغيل الكاميرا في المتصفح";
                    document.getElementById('status').style.color = "#dc2626";
                });
        }

        // إيقاف الكاميرا فوراً بعد المسح
        function stopCameraAndShowResult(renderHtml) {
            if (isCameraRunning && html5QrCode) {
                html5QrCode.stop().then(() => {
                    isCameraRunning = false;
                    document.getElementById('camera-wrapper').style.display = 'none';
                    document.getElementById('product-content').innerHTML = renderHtml;
                    document.getElementById('result-card').style.display = 'block';
                    document.getElementById('status').innerText = "✨ تم العثور على المنتج بنجاح";
                }).catch(err => {
                    console.error("خطأ في إيقاف الكاميرا", err);
                });
            }
        }

        // معالجة النتيجة عند قراءة الكود
        function onScanSuccess(decodedText) {
            const product = findProduct(decodedText);
            let html = "";

            if (product) {
                const name = cleanString(product.name || product.Produkt || product['الاسم'] || 'منتج غير مسمى');
                const price = cleanString(product.price || product.Preis || product['السعر'] || '0');
                const offer = cleanString(product.offer || product.Offer || product['العرض']);
                const desc = cleanString(product.Beschreibung || product.desc || product['الوصف']);

                html += `<div class="product-title">${name}</div>`;
                if (desc) {
                    html += `<div class="product-desc">${desc}</div>`;
                }

                html += `<div class="price-box">`;
                if (offer !== "") {
                    html += `<div class="old-price">السعر الأصلي: ${price} €</div>`;
                    html += `<div class="price-offer">${offer} €</div>`;
                    html += `<div class="offer-tag">🔥 عرض خاص</div>`;
                } else {
                    html += `<div class="price-normal">${price} €</div>`;
                }
                html += `</div>`;
            } else {
                html = `
                    <div class="error-box">
                        ❌ المنتج غير مسجل في الجدول
                        <div style="font-size: 16px; color: #64748b; margin-top: 8px; font-weight: normal;">
                            (كود المنتج: ${decodedText})
                        </div>
                    </div>
                `;
            }

            stopCameraAndShowResult(html);
        }

        // إعادة تشغيل الكاميرا لمسح منتج جديد
        function restartCamera() {
            startDirectCamera();
        }
    </script>
</body>
</html>
