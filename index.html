<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>نظام الكاشير - نقطة البيع</title>
  <style>
    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
    }
    body { 
      background-color: #0f172a; 
      color: #f8fafc; 
      min-height: 100vh; 
      display: flex; 
      flex-direction: column; 
      padding: 12px; 
    }
    header { 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      margin-bottom: 8px; 
    }
    h1 { font-size: 1.25rem; font-weight: 700; }
    #status { font-size: 0.8rem; color: #38bdf8; }
    
    .btn-sync {
      background-color: #0284c7;
      color: #fff;
      border: none;
      padding: 6px 12px;
      border-radius: 8px;
      font-weight: bold;
      font-size: 0.8rem;
      cursor: pointer;
    }
    .btn-sync:active { background-color: #0369a1; }

    .input-section { margin-bottom: 8px; }
    #barcode-input {
      width: 100%; padding: 12px; font-size: 1.1rem; font-weight: bold; border-radius: 10px;
      border: 2px solid #3b82f6; background-color: #1e293b; color: #38bdf8; text-align: center; outline: none;
    }
    #barcode-input:focus { border-color: #60a5fa; box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.25); }

    #feedback {
      min-height: 38px; padding: 8px 12px; border-radius: 8px; margin-bottom: 8px;
      font-weight: 600; font-size: 0.9rem; display: flex; align-items: center; justify-content: center;
      text-align: center; background-color: #1e293b; border: 1px dashed #334155;
    }
    .success { background-color: #14532d !important; color: #86efac !important; border: 1px solid #22c55e !important; }
    .error { background-color: #7f1d1d !important; color: #fca5a5 !important; border: 1px solid #ef4444 !important; }

    .total-card {
      background-color: #1e293b; border: 1px solid #334155; border-radius: 12px;
      padding: 10px 14px; margin-bottom: 8px;
    }
    .row-info {
      display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px;
    }
    .total-title { font-size: 0.85rem; color: #94a3b8; }
    .total-price { font-size: 1.6rem; font-weight: 800; color: #22c55e; }
    .change-text { font-size: 1.3rem; font-weight: 800; color: #facc15; }

    .cash-calc-box {
      background-color: #1e293b; border: 1px solid #334155; border-radius: 12px;
      padding: 8px 10px; margin-bottom: 8px;
    }
    .cash-title { font-size: 0.8rem; color: #94a3b8; margin-bottom: 6px; font-weight: 600; }
    
    .denominations-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 6px;
      margin-bottom: 6px;
    }
    .btn-euro {
      background-color: #334155; color: #f8fafc; border: 1px solid #475569;
      padding: 7px 2px; border-radius: 8px; font-size: 0.9rem; font-weight: bold;
      cursor: pointer; text-align: center;
    }
    .btn-euro:active { background-color: #3b82f6; border-color: #60a5fa; }
    .btn-note { background-color: #1e3a8a; border-color: #2563eb; color: #93c5fd; }

    .cash-controls { display: flex; gap: 6px; margin-top: 4px; }
    .btn-quick {
      flex: 1; padding: 6px; font-size: 0.8rem; border-radius: 6px; border: none;
      font-weight: bold; cursor: pointer; background-color: #475569; color: #fff;
    }
    .btn-quick:active { background-color: #64748b; }

    .actions-bar { display: flex; gap: 8px; margin-bottom: 8px; }
    .btn-pay {
      flex: 2; background-color: #16a34a; color: #fff; border: none; padding: 12px;
      border-radius: 10px; font-size: 1rem; font-weight: bold; cursor: pointer;
    }
    .btn-pay:active { background-color: #15803d; }
    .btn-clear {
      flex: 1; background-color: #475569; color: #cbd5e1; border: none; padding: 12px;
      border-radius: 10px; font-size: 0.9rem; font-weight: 600; cursor: pointer;
    }

    .cart-container {
      flex: 1; background-color: #ffffff; border-radius: 12px; padding: 10px;
      color: #0f172a; overflow-y: auto; max-height: 28vh;
    }
    .cart-item { display: flex; justify-content: space-between; align-items: center; padding: 7px 4px; border-bottom: 1px solid #e2e8f0; }
    .item-name { font-weight: 600; font-size: 0.88rem; }
    .item-price { font-weight: 700; color: #16a34a; font-size: 0.9rem; }
    .empty-cart { text-align: center; color: #94a3b8; padding-top: 25px; font-size: 0.85rem; }
  </style>
</head>
<body>

  <header>
    <div>
      <h1>🧾 كاشير المحل</h1>
      <div id="status">⏳ جاري تحميل المنتجات...</div>
    </div>
    <button class="btn-sync" onclick="loadProducts()">تحديث 🔄</button>
  </header>

  <div class="input-section">
    <input 
      type="text" 
      id="barcode-input" 
      placeholder="امسح بالسكنر مباشرة..." 
      autocomplete="off" 
      autocorrect="off" 
      autocapitalize="off" 
      spellcheck="false"
      autofocus
    >
  </div>

  <div id="feedback">جاهز للمسح بالسكنر...</div>

  <div class="total-card">
    <div class="row-info">
      <span class="total-title">المجموع المطلوب:</span>
      <span class="total-price" id="total-val">0.00 €</span>
    </div>
    <div class="row-info">
      <span class="total-title">المستلم من الزبون:</span>
      <span style="font-size: 1.1rem; font-weight: bold; color: #38bdf8;" id="paid-val">0.00 €</span>
    </div>
    <div class="row-info">
      <span class="total-title">الباقي للزبون:</span>
      <span class="change-text" id="change-val">0.00 €</span>
    </div>
  </div>

  <div class="cash-calc-box">
    <div class="cash-title">💶 فئات اليورو (المبلغ المستلم):</div>
    <div class="denominations-grid">
      <button class="btn-euro btn-note" onclick="addCash(100)">100€</button>
      <button class="btn-euro btn-note" onclick="addCash(50)">50€</button>
      <button class="btn-euro btn-note" onclick="addCash(20)">20€</button>
      <button class="btn-euro btn-note" onclick="addCash(10)">10€</button>
      <button class="btn-euro btn-note" onclick="addCash(5)">5€</button>
    </div>
    <div class="denominations-grid">
      <button class="btn-euro" onclick="addCash(2)">2€</button>
      <button class="btn-euro" onclick="addCash(1)">1€</button>
      <button class="btn-euro" onclick="addCash(0.50)">0.50€</button>
      <button class="btn-euro" onclick="addCash(0.20)">0.20€</button>
      <button class="btn-euro" onclick="addCash(0.10)">0.10€</button>
    </div>
    <div class="cash-controls">
      <button class="btn-quick" onclick="setExactCash()">المبلغ بالضبط</button>
      <button class="btn-quick" style="background-color: #7f1d1d;" onclick="resetCash()">تصفير المستلم</button>
    </div>
  </div>

  <div class="actions-bar">
    <button class="btn-pay" onclick="handlePayment()">💵 إتمام الدفع وخصم المخزون</button>
    <button class="btn-clear" onclick="clearCart()">إلغاء السلة</button>
  </div>

  <div class="cart-container" id="cart-list">
    <div class="empty-cart">السلة فارغة - ابدأ بالمسح</div>
  </div>

  <script>
    const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQCpR9i8vwj3iwcjDyB3xQjx2iTaD3s1kLjYRbwNQW-IOcrdADwRE4mBGbk96pxKGKLYqfbpjVuDLqI/pub?output=csv";
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbz6VkxJteGJAeQaR5oTqdYValeCbxP62sr71HzkbcYy9kviVPb3cdK4-fdCgb0uibIHIA/exec";

    let products = [];
    let cart = [];
    let receivedCash = 0;
    let invoiceCounter = parseInt(localStorage.getItem('last_invoice_no') || '1000');

    const inputField = document.getElementById('barcode-input');
    const statusDiv = document.getElementById('status');
    const feedbackDiv = document.getElementById('feedback');
    const cartList = document.getElementById('cart-list');
    const totalVal = document.getElementById('total-val');
    const paidVal = document.getElementById('paid-val');
    const changeVal = document.getElementById('change-val');

    function normalizeBarcode(str) {
      const arabicNumbers = ['٠', '١', '٢', '٣', '٤', '٥', '٦', '٧', '٨', '٩'];
      return String(str || '').replace(/[٠-٩]/g, d => arabicNumbers.indexOf(d)).trim();
    }

    // محلل CSV احترافي يتجاهل الفواصل داخل النصوص وعلامات التنصيص
    function parseCSVLine(text) {
      let p = '', c = false, r = [];
      for (let i = 0; i < text.length; i++) {
        let ch = text[i];
        if (ch === '"') {
          if (c && text[i + 1] === '"') { p += '"'; i++; }
          else { c = !c; }
        } else if (ch === ',' && !c) {
          r.push(p);
          p = '';
        } else {
          p += ch;
        }
      }
      r.push(p);
      return r;
    }

    // تنظيف الأرقام من العملات وتحويل الفاصلة الألمانية لنقطة
    function cleanNumber(val) {
      if (!val) return 0;
      let s = String(val).trim().replace(/[^0-9.,]/g, '');
      if (s.includes(',') && s.includes('.')) {
        s = s.replace(/\./g, '').replace(',', '.');
      } else if (s.includes(',')) {
        s = s.replace(',', '.');
      }
      return parseFloat(s) || 0;
    }

    function loadProducts() {
      statusDiv.textContent = "⏳ جاري تحديث البيانات...";
      fetch(SHEET_CSV_URL + "&_cb=" + new Date().getTime())
        .then(res => res.text())
        .then(csvText => {
          const lines = csvText.split(/\r?\n/).filter(line => line.trim().length > 0);
          if (lines.length < 2) return;

          const rawHeaders = parseCSVLine(lines[0]);
          const headers = rawHeaders.map(h => h.trim().toLowerCase());

          // تحديد أماكن الأعمدة بالاسم تلقائياً
          const barcodeIdx = headers.findIndex(h => h.includes('barcode') || h.includes('بار كود'));
          const nameIdx = headers.findIndex(h => h.includes('name') || h.includes('produkt') || h.includes('الاسم'));
          const priceIdx = headers.findIndex(h => h.includes('price') || h.includes('preis') || h.includes('السعر'));
          const offerIdx = headers.findIndex(h => h.includes('offer') || h.includes('angebot') || h.includes('عرض'));

          const loaded = [];

          for (let i = 1; i < lines.length; i++) {
            const cols = parseCSVLine(lines[i]);
            if (cols.length < 2) continue;

            const rawBarcode = barcodeIdx !== -1 ? cols[barcodeIdx] : cols[0];
            const name = nameIdx !== -1 ? cols[nameIdx] : cols[1];
            
            const basePrice = priceIdx !== -1 ? cleanNumber(cols[priceIdx]) : 0;
            const offerPrice = offerIdx !== -1 ? cleanNumber(cols[offerIdx]) : 0;

            // اعتماد سعر العرض إذا كان مدخلاً وأكبر من الصفر
            const hasOffer = offerPrice > 0;
            const finalPrice = hasOffer ? offerPrice : basePrice;

            if (rawBarcode && String(rawBarcode).trim() !== '') {
              loaded.push({ 
                barcode: normalizeBarcode(rawBarcode), 
                name: hasOffer ? `${name.trim()} (عرض 🔥)` : name.trim(), 
                price: finalPrice 
              });
            }
          }

          products = loaded;
          statusDiv.textContent = `✅ جاهز (${loaded.length} منتج)`;
          keepFocus();
        })
        .catch(() => {
          statusDiv.textContent = "❌ خطأ في تحميل جدول المنتجات";
        });
    }

    loadProducts();

    function keepFocus() {
      setTimeout(() => { inputField.focus(); }, 50);
    }

    document.addEventListener('click', (e) => {
      if (e.target.tagName !== 'BUTTON') keepFocus();
    });

    inputField.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        processScan(inputField.value);
      }
    });

    function processScan(rawCode) {
      const code = normalizeBarcode(rawCode);
      if (!code) return;

      const product = products.find(p => p.barcode === code);

      if (product) {
        cart.unshift(product);
        showFeedback(`✅ ${product.name} - ${product.price.toFixed(2)} €`, "success");
        renderCart();
      } else {
        showFeedback(`❌ غير مسجل: ${code}`, "error");
      }

      inputField.value = "";
      keepFocus();
    }

    function showFeedback(text, type) {
      feedbackDiv.textContent = text;
      feedbackDiv.className = type;
    }

    function getTotalSum() {
      return cart.reduce((sum, item) => sum + item.price, 0);
    }

    function addCash(amount) {
      receivedCash = parseFloat((receivedCash + amount).toFixed(2));
      updateCashUI();
      keepFocus();
    }

    function resetCash() {
      receivedCash = 0;
      updateCashUI();
      keepFocus();
    }

    function setExactCash() {
      receivedCash = parseFloat(getTotalSum().toFixed(2));
      updateCashUI();
      keepFocus();
    }

    function updateCashUI() {
      const total = getTotalSum();
      paidVal.textContent = `${receivedCash.toFixed(2)} €`;

      const change = receivedCash - total;
      if (receivedCash === 0) {
        changeVal.textContent = "0.00 €";
        changeVal.style.color = "#facc15";
      } else if (change >= 0) {
        changeVal.textContent = `${change.toFixed(2)} €`;
        changeVal.style.color = "#22c55e";
      } else {
        changeVal.textContent = `ناقص: ${Math.abs(change).toFixed(2)} €`;
        changeVal.style.color = "#ef4444";
      }
    }

    function renderCart() {
      if (cart.length === 0) {
        cartList.innerHTML = '<div class="empty-cart">السلة فارغة - ابدأ بالمسح</div>';
        totalVal.textContent = "0.00 €";
        resetCash();
        return;
      }

      let html = "";
      let sum = 0;

      cart.forEach(item => {
        sum += item.price;
        html += `
          <div class="cart-item">
            <span class="item-name">${item.name}</span>
            <span class="item-price">${item.price.toFixed(2)} €</span>
          </div>
        `;
      });

      cartList.innerHTML = html;
      totalVal.textContent = `${sum.toFixed(2)} €`;
      updateCashUI();
    }

    function handlePayment() {
      if (cart.length === 0) {
        showFeedback("⚠️ السلة فارغة!", "error");
        keepFocus();
        return;
      }

      const totalSum = getTotalSum();
      const finalPaid = receivedCash > 0 ? receivedCash : totalSum;
      const finalChange = finalPaid >= totalSum ? (finalPaid - totalSum) : 0;

      invoiceCounter++;
      localStorage.setItem('last_invoice_no', invoiceCounter);

      const now = new Date();
      const dateStr = now.toLocaleDateString('ar-EG') + ' ' + now.toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' });

      // تجميع الأصناف وتمرير الباركود بدقة لخصم المخزون
      const summary = {};
      cart.forEach(item => {
        if (!summary[item.name]) {
          summary[item.name] = { 
            barcode: item.barcode, 
            name: item.name, 
            count: 0, 
            price: item.price, 
            total: 0 
          };
        }
        summary[item.name].count += 1;
        summary[item.name].total += item.price;
      });

      const invoicePayload = {
        invoiceNo: invoiceCounter,
        date: dateStr,
        total: `${totalSum.toFixed(2)} €`,
        paid: `${finalPaid.toFixed(2)} €`,
        change: `${finalChange.toFixed(2)} €`,
        items: Object.values(summary)
      };

      // إرسال البيانات لحفظ PDF وخصم الكميات من Google Sheets
      fetch(GOOGLE_SCRIPT_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(invoicePayload)
      });

      showFeedback(`🎉 تم دفع #${invoiceCounter} وحُدّث المخزون | الباقي: ${finalChange.toFixed(2)} €`, "success");
      cart = [];
      receivedCash = 0;
      renderCart();
      keepFocus();
    }

    function clearCart() {
      if (cart.length === 0) return;
      cart = [];
      receivedCash = 0;
      renderCart();
      showFeedback("تم إلغاء السلة الحالية", "");
      keepFocus();
    }
  </script>
</body>
</html>
